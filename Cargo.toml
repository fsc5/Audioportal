[package]
name = "audioportal"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "7"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"

[dev-dependencies]
rubato = { version = "5.0.1", default-features = false }
audioadapter-buffers = "5.1"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
rubato = { version = "5.0.1", default-features = false }
audioadapter-buffers = "5.1"
